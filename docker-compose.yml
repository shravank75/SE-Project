version: '3.9'

services:
  web:
    container_name: nextjs-app
    build: .
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      # if you have .env.local, uncomment below line
      # - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
